world:
  #rect: [0, 0, 12.7, 4.8]  # grande
  rect: [0, 0, 3.5, 2.1]  # chico

robot:
  # Fixed specs
  rect: [0, 0, 0.4, 0.5]  # grande
  blade_pos: [0, 0]
  blade_diameter: 0.35
  distance_between_wheels: 0.45
  lateral_disturbance: 0.2
  speed_step: 0.2          # m/s added per W/S keypress
  angle_step: 0.4          # rad/s added per A/D keypress
  max_speed: 0.4           # m/s at full joystick deflection
  max_angular_speed: 0.8   # rad/s at full joystick deflection
  max_lateral_accel: 0.5   # m/s², auto mode slows down so cornering stays under this
  turn_radius: 0.2
  overlap: 0.1
  paused_at_beginning: True
  tracking_enabled: False
  horn: False