[project]
name = "gardeden"
version = "0.1.0"
description = "Autonomous lawn-mowing robot: simulator first, then hardware"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dubins",
    "numpy==2.2.6",
    "opencv-contrib-python==4.12.0.88", # includes cv2.aruco; don't also add opencv-python (both ship cv2)
    "pygame==2.6.1",
    "pyyaml==6.0.2",
]

[dependency-groups]
dev = ["pytest>=9"]
notebooks = ["ipykernel", "matplotlib"] # only for experiments/*.ipynb

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
dubins = { git = "https://github.com/rdesc/pydubins.git", rev = "58c4b68d9ddf972dfd32afea295c3195da648cf2" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
