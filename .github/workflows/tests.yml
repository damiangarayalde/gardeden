name: tests

on: [push, pull_request]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # opencv-contrib-python (the non-headless build, kept for cv2.imshow in experiments/) needs libGL
      - run: sudo apt-get update && sudo apt-get install -y libgl1
      - run: uv sync --locked
      - run: uv run pytest
        env:
          SDL_VIDEODRIVER: dummy  # no display on the runner
